plugins {
    id 'java'
    id 'io.qameta.allure' version '4.0.1'
}

group = 'guru.qa'
version = '1.0'

repositories {
    mavenCentral()
}

allure {
    report {
        version.set('2.39.0')
    }
    adapter {
        frameworks {
            junit5 {
                adapterVersion.set('2.29.1')
            }
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation(
            'org.junit.jupiter:junit-jupiter',
            'com.codeborne:selenide:7.16.0',
            'org.slf4j:slf4j-simple:2.0.16',
            'io.qameta.allure:allure-selenide:2.34.0'
    )
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {

    systemProperties(System.getProperties())

    useJUnitPlatform()
    systemProperty("allure.results.directory", "build/allure-results")

    testLogging {
        lifecycle {
            events "started", "skipped", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    afterSuite { desc, result ->
        println "Tests executed: ${result.testCount}"
    }
}

tasks.register('properties_test5', Test) {
    useJUnitPlatform {
        includeTags 'test5'
        excludeTags 'prod'
    }

}

tasks.register('hello_test', Test) {
        useJUnitPlatform {
            includeTags 'hello'
            excludeTags 'prod'
        }
}